<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="全体の時間を発表者の人数で割り、誰かが超過すると残りの人の持ち時間を自動で計算し直すタイマーです。">
<title>TaktTime</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FPS37V7ZM7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-FPS37V7ZM7');

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
/* Layout: one screen. Settings bar on top, one huge countdown, three stats, a strip of presenter chips. */
:root {
  --bg: #F2F4F1;
  --surface: #E4E9E5;
  --ink: #18221E;
  --muted: #5C6B65;
  --accent: #962649; /* DIC 273 */
  --ontime: #3FA37E;
  --warn: #8C5A00;
  --over: #C0392B;
  --font-text: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --font-num: "Chivo Mono", ui-monospace, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111916; --surface: #1D2824; --ink: #E4ECE8; --muted: #8FA19A;
    --accent: #B8405F; --ontime: #6FBF9F; --warn: #E2A93B; --over: #F0705F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111916; --surface: #1D2824; --ink: #E4ECE8; --muted: #8FA19A;
  --accent: #B8405F; --ontime: #6FBF9F; --warn: #E2A93B; --over: #F0705F;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: clamp(.4rem, 2.2vh, 1.25rem); padding-block: clamp(.4rem, 2vh, 1rem); max-width: 1400px; margin: 0 auto; overflow: hidden; }
.settings { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; color: var(--muted); font-size: .95rem; }
.settings label { display: flex; align-items: center; gap: .4rem; }
/* Every control is at least 44px tall (HIG minimum hit target). */
.settings input {
  width: 4.5em; height: 44px; box-sizing: border-box; font: 600 1rem var(--font-num); color: var(--ink); background: var(--surface);
  border: 1px solid transparent; border-radius: 8px; padding: 0 .5rem; text-align: right;
}
.settings input[type="time"] { width: auto; }
.settings input:focus-visible { outline: 2px solid var(--accent); }
/* Locked after start: drop the field background so the values read as fixed text. */
.settings input:disabled { background: transparent; color: var(--muted); opacity: 1; appearance: none; padding-inline: 0; }

.seg { display: inline-flex; background: var(--surface); border-radius: 10px; padding: 2px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { min-height: 40px; padding: 0 1rem; border-radius: 8px; color: var(--muted); font-weight: 700; cursor: pointer; }
.seg input:checked + label { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }
.seg:has(input:disabled) { background: transparent; padding: 0; }
.seg input:disabled + label { cursor: default; box-shadow: none; background: transparent; color: var(--muted); padding: 0; }
.seg input:disabled:not(:checked) + label { display: none; }

.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 44px; height: 44px; padding: 0; font: 600 1.3rem var(--font-num); }
.stepper button:disabled { display: none; }
.field { display: flex; align-items: center; gap: .4rem; }
.settings .base { font-family: var(--font-num); }
.settings .hint { margin-left: auto; font-size: .8rem; }

/* The stage takes whatever height is left; everything inside scales to the stage box, not the window. */
.stage { flex: 1; min-height: 0; container-type: size; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: min(2cqh, .6rem); }
.who { font-size: clamp(.9rem, min(4cqw, 8cqh), 2.2rem); letter-spacing: .04em; color: var(--muted); }
.who b { color: var(--ink); font-family: var(--font-num); }
.clock {
  font: 600 min(25cqw, 56cqh)/1 var(--font-num); font-variant-numeric: tabular-nums;
  color: var(--ink); transition: color .3s; white-space: nowrap;
}
.state { font-size: clamp(.85rem, min(3cqw, 6cqh), 1.8rem); min-height: 1.4em; color: var(--muted); text-align: center; }
.bar { width: min(100%, 900px); height: clamp(4px, 2cqh, 12px); background: var(--surface); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ontime); transition: width .3s linear, background .3s; }
.warn .clock, .warn .state { color: var(--warn); }
.warn .bar i { background: var(--warn); }
.over .clock, .over .state { color: var(--over); }
.over .bar i { background: var(--over); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.stat { display: flex; flex-direction: column; gap: .2rem; }
.stat span { font-size: .8rem; color: var(--muted); letter-spacing: .05em; }
.stat b { font: 600 clamp(1rem, min(3.5vw, 5vh), 2.4rem) var(--font-num); font-variant-numeric: tabular-nums; }
.stat small { font: .85rem var(--font-num); color: var(--muted); }
.stat small.minus { color: var(--over); }

.controls { display: flex; flex-direction: column; gap: .5rem; }
.controls .sub { display: flex; gap: .5rem; }
.controls .sub button { flex: 1; }
.controls .sub #reset { flex: 0 0 auto; margin-left: auto; }
.destructive:not(:disabled) { color: var(--over); }
dialog {
  background: var(--bg); color: var(--ink); border: 0; border-radius: 14px; padding: 1.25rem;
  width: min(22rem, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 12px 40px rgb(0 0 0 / .35);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog h2 { margin: 0 0 .4rem; font-size: 1.1rem; }
dialog p { margin: 0 0 1.1rem; color: var(--muted); line-height: 1.6; }
.dialog-actions { display: flex; gap: .5rem; }
.dialog-actions button { flex: 1; }
button {
  font: 700 1rem var(--font-text); border-radius: 8px; padding: clamp(.4rem, 1.6vh, .8rem) 1.4rem; cursor: pointer; min-height: 44px;
  border: 2px solid var(--surface); background: var(--surface); color: var(--ink);
}
button:hover:not(:disabled) { border-color: var(--accent); }
/* The main action is two rows tall: the height of the row below, twice, plus the gap. */
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; min-height: calc(88px + .5rem); font-size: 1.25rem; }
button.primary:hover:not(:disabled) { border-color: var(--ink); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
/* Disabled: no fill, dashed outline, faded text — reads as "not available" next to the filled buttons. */
button:disabled, button.primary:disabled {
  background: transparent; border: 2px dashed var(--surface); color: var(--muted); opacity: .55; cursor: not-allowed;
}

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.2rem, 1fr)); gap: .4rem; }
.chip { background: var(--surface); border-radius: 6px; padding: .35rem .45rem; font: .78rem var(--font-num); display: flex; flex-direction: column; gap: .1rem; border-bottom: 3px solid transparent; }
.chip .n { color: var(--muted); }
.chip.done { border-bottom-color: var(--ontime); }
.chip.done.late { border-bottom-color: var(--over); }
.chip.now { outline: 2px solid var(--ink); outline-offset: -2px; }
.chip .t { font-weight: 600; }
.chip .late-mark { color: var(--over); font-family: var(--font-text); font-weight: 700; }

@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .stats .stat:last-child { grid-column: span 2; }
  .settings .hint { display: none; }
}
/* Short, wide screens (projector, landscape phone): drop the secondary lines so the clock keeps its room. */
@media (max-height: 520px) {
  .stat small, .stat span { display: none; }
  .stat b::before { content: attr(data-label) " "; font: .75rem var(--font-text); color: var(--muted); }
  .strip { grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); }
  .chip { padding: .15rem .3rem; flex-direction: row; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="settings">
    <div class="seg" role="radiogroup" aria-label="時間の指定方法">
      <input type="radio" name="mode" id="modeEnd" value="end" checked><label for="modeEnd">終了時刻</label>
      <input type="radio" name="mode" id="modeDur" value="dur"><label for="modeDur">長さ</label>
    </div>
    <label for="total" id="totalWrap" hidden>全体 <input id="total" type="number" min="1" value="90"> 分</label>
    <label for="endAt" id="endWrap"><input id="endAt" type="time" value="12:00"> まで</label>
    <span class="field"><label for="count">人数</label>
      <span class="stepper">
        <button type="button" id="dec" aria-label="1 人減らす">−</button>
        <input id="count" type="number" min="1" value="10">
        <button type="button" id="inc" aria-label="1 人増やす">＋</button>
      </span> 人</span>
    <span>基準 <span class="base" id="base">6:00</span> / 人</span>
    <span class="hint">→ 開始・次の人 ／ ← 1 人戻す</span>
  </div>

  <div class="stage" id="stage">
    <div class="who" id="who">発表者 <b>1</b> / 15</div>
    <div class="clock" id="clock">6:00</div>
    <div class="state" id="state">開始を押すと 1 人目の時間が始まります</div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="stats">
    <div class="stat"><span>全体の残り</span><b id="left" data-label="全体">90:00</b><small id="end">&nbsp;</small></div>
    <div class="stat"><span>次の人の持ち時間</span><b id="next" data-label="次">6:00</b><small id="nextDiff">&nbsp;</small></div>
    <div class="stat"><span>この人の持ち時間</span><b id="allot" data-label="この人">6:00</b><small id="allotDiff">&nbsp;</small></div>
  </div>

  <div class="controls">
    <button class="primary" id="nextBtn">開始</button>
    <div class="sub">
      <button id="backBtn">← 1 人戻す</button>
      <button id="reset" class="destructive">最初から</button>
    </div>
  </div>

  <div class="strip" id="strip"></div>
</div>

<dialog id="confirm">
  <h2>最初からやり直しますか？</h2>
  <p>記録した発表時間はすべて消えます。この操作は取り消せません。</p>
  <div class="dialog-actions">
    <button type="button" id="cancel" autofocus>キャンセル</button>
    <button type="button" id="doReset" class="destructive">最初から</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const KEY = 'takttime-v1';
const LAST = 'takttime-last'; // settings used at the last start
const modeValue = () => document.querySelector('input[name="mode"]:checked').value;

// All times are wall-clock ms. Once started, the session has a fixed deadline `end`:
// mode 'dur' sets it to start + total, mode 'end' to the chosen time of day.
let s;
function fresh() {
  return {
    v: 1,
    mode: modeValue(),
    total: Math.max(1, +$('total').value || 1) * 60000,
    endHM: $('endAt').value || '12:00',
    n: Math.max(1, Math.round(+$('count').value) || 1),
    startedAt: null, i: 0, turnStart: 0,
    end: null, base: null, allot: null, finalLeft: null, log: []
  };
}
const started = () => !!s.startedAt;
const finished = () => s.i >= s.n;
function endFromHM(hm) {
  const [h, m] = hm.split(':').map(Number), d = new Date();
  d.setHours(h, m, 0, 0);
  if (d < Date.now()) d.setDate(d.getDate() + 1); // a time already past means tomorrow
  return +d;
}
const deadline = () => s.end ?? (s.mode === 'end' ? endFromHM(s.endHM) : Date.now() + s.total);
const remaining = () => s.finalLeft ?? deadline() - Date.now();
const base = () => s.base ?? Math.max(0, remaining()) / s.n;
const allot = () => s.allot ?? base();

function fmt(ms, sign) {
  const neg = ms < 0; ms = Math.abs(ms);
  const t = Math.round(ms / 1000), m = Math.floor(t / 60), sec = t % 60;
  return (neg ? '−' : sign && t ? '+' : '') + m + ':' + String(sec).padStart(2, '0');
}
// Countdown rounds toward the deadline so it reads 0:00 exactly when time is up.
function fmtDown(ms, overSign = '+') {
  const t = ms >= 0 ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
  const a = Math.abs(t);
  return (t < 0 ? overSign : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
}
const hhmm = t => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.v === 1) return v; } catch (e) {}
  return null;
}

// Trim an allotment by under half a second so the speaker's deadline falls on the same
// second boundary as the session's end; both countdowns then tick at the same moment.
function aligned(raw, turnStart) {
  const after = s.end - turnStart - raw;
  return s.end - turnStart - Math.round(after / 1000) * 1000;
}
// Starts the session, or hands over to the next speaker.
function next() {
  if (finished()) return;
  const now = Date.now();
  if (!started()) {
    s.end = deadline();
    s.base = base();
    s.allot = aligned(s.base, now);
    s.startedAt = s.turnStart = now;
    try { localStorage.setItem(LAST, JSON.stringify({ mode: s.mode, total: s.total, n: s.n })); } catch (e) {}
  } else {
    s.log.push({ allot: s.allot, used: now - s.turnStart });
    s.i++;
    s.turnStart = now;
    if (finished()) s.finalLeft = s.end - now;
    else s.allot = aligned(Math.max(0, s.end - now) / (s.n - s.i), now);
  }
  save(); render();
}
// Undo the last handover: the previous speaker continues with their original allotment.
function back() {
  if (!s.log.length) return;
  const r = s.log.pop();
  s.i--;
  s.turnStart -= r.used;
  s.allot = r.allot;
  s.finalLeft = null;
  save(); render();
}
function reset() {
  s = fresh(); save(); render();
  $('confirm').close();
}
function step(d) {
  $('count').value = Math.max(1, (Math.round(+$('count').value) || 1) + d);
  applySettings();
}
function applySettings() {
  if (started()) return; // locked once started
  s = fresh(); save(); render();
}

function render() {
  const now = Date.now(), left = remaining(), b = base(), a = allot();
  for (const id of ['modeEnd', 'modeDur', 'total', 'endAt', 'count', 'dec', 'inc']) $(id).disabled = started();
  $('totalWrap').hidden = s.mode === 'end'; $('endWrap').hidden = s.mode !== 'end';
  $('base').textContent = fmt(b);

  const stage = $('stage');
  stage.classList.remove('warn', 'over');

  if (finished()) {
    $('who').innerHTML = '全員終了';
    // Same sign convention as the countdown: "+" means over time.
    $('clock').textContent = (left < 0 ? '+' : '−') + fmt(Math.abs(left));
    $('state').textContent = left >= 0 ? '予定より ' + fmt(left) + ' 早く終わりました' : '予定を ' + fmt(-left) + ' 超えて終わりました';
    if (left < 0) stage.classList.add('over');
    $('bar').style.width = '100%';
  } else {
    const used = started() ? now - s.turnStart : 0, rem = a - used;
    $('who').innerHTML = '発表者 <b>' + (s.i + 1) + '</b> / ' + s.n;
    // Before the start, round like the stats below so the clock and "この人の持ち時間" agree.
    $('clock').textContent = started() ? fmtDown(rem) : fmt(rem);
    $('bar').style.width = Math.min(100, a ? used / a * 100 : 100) + '%';
    let msg;
    if (!started()) msg = '開始を押すと 1 人目の時間が始まります';
    else if (rem < 0) { msg = '超過中。残り ' + (s.n - s.i - 1) + ' 人の時間から引かれています'; stage.classList.add('over'); }
    else if (rem < 60000) { msg = 'まもなく終了'; stage.classList.add('warn'); }
    else msg = '発表中';
    $('state').textContent = msg;
  }

  // Stats
  $('left').textContent = started() && !finished() ? fmtDown(left, '−') : fmt(left);
  $('end').textContent = (started() ? '終了 ' : '終了予定 ') + hhmm(deadline());
  const restN = s.n - s.i - 1;
  if (!finished() && restN > 0) {
    // What each remaining person gets if the current speaker uses exactly their allotment
    // (or, once over, stops right now).
    const curRem = Math.max(0, a - (started() ? now - s.turnStart : 0));
    const nextAllot = Math.max(0, left - curRem) / restN;
    $('next').textContent = fmt(nextAllot);
    setDiff('nextDiff', nextAllot - b);
  } else { $('next').textContent = '—'; $('nextDiff').textContent = ' '; }
  if (!finished()) { $('allot').textContent = fmt(a); setDiff('allotDiff', a - b); }
  else { $('allot').textContent = '—'; $('allotDiff').textContent = ' '; }

  // Controls
  $('nextBtn').textContent = finished() ? '全員終了' : !started() ? '開始' : s.i === s.n - 1 ? '終了する' : '次の人へ →';
  $('nextBtn').disabled = finished();
  $('backBtn').disabled = !s.log.length;
  $('reset').disabled = !started();

  // Strip
  let html = '';
  for (let k = 0; k < s.n; k++) {
    const r = s.log[k];
    let cls = 'chip', t = '';
    const late = r && r.used > r.allot + 999;
    if (r) { cls += ' done' + (late ? ' late' : ''); t = fmt(r.used); }
    else if (k === s.i) { cls += ' now'; if (started()) t = fmt(now - s.turnStart); }
    html += '<div class="' + cls + '"><span class="n">' + (k + 1) + (late ? ' <span class="late-mark">超過</span>' : '') +
      '</span><span class="t">' + (t || '&nbsp;') + '</span></div>';
  }
  $('strip').innerHTML = html;
}
function setDiff(id, d) {
  const el = $(id);
  if (Math.abs(d) < 1000) { el.textContent = '基準どおり'; el.className = ''; return; }
  el.textContent = '基準より ' + fmt(d, true);
  el.className = d < 0 ? 'minus' : '';
}

$('nextBtn').onclick = next;
$('backBtn').onclick = back;
$('reset').onclick = () => $('confirm').showModal();
$('cancel').onclick = () => $('confirm').close();
$('doReset').onclick = reset;
$('dec').onclick = () => step(-1);
$('inc').onclick = () => step(1);
['modeEnd', 'modeDur', 'total', 'endAt', 'count'].forEach(id => $(id).addEventListener('input', applySettings));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || $('confirm').open) return;
  // Presentation remotes usually send PageDown/PageUp; some send arrows.
  const k = e.key;
  if (['PageDown', 'ArrowRight', 'ArrowDown', 'Enter', ' '].includes(k)) { e.preventDefault(); next(); }
  else if (['PageUp', 'ArrowLeft', 'ArrowUp'].includes(k)) { e.preventDefault(); back(); }
});

// Default end time: 90 minutes from now.
function defaultEndHM() {
  const d = new Date(Date.now() + 90 * 60000), p = x => String(x).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function start() {
  // Continue a session in progress (e.g. after a reload) unless it is over or long past its end.
  const saved = load();
  if (saved && saved.startedAt && saved.i < saved.n && Date.now() < saved.end + 30 * 60000) s = saved;
  else {
    // Otherwise start fresh with the settings of the last start; first time: end mode, 90 minutes, 10 speakers.
    // The end time is not kept: it is always 90 minutes from now.
    let last = null;
    try { last = JSON.parse(localStorage.getItem(LAST)); } catch (e) {}
    last = { mode: 'end', total: 90 * 60000, n: 10, ...last, endHM: defaultEndHM() };
    // URL parameters win: ?end=12:10 or ?min=90, and ?n=15
    const q = new URLSearchParams(location.search);
    if (/^\d{1,2}:\d{2}$/.test(q.get('end') || '')) { last.mode = 'end'; last.endHM = q.get('end').padStart(5, '0'); }
    else if (+q.get('min') > 0) { last.mode = 'dur'; last.total = +q.get('min') * 60000; }
    if (Math.round(+q.get('n')) >= 1) last.n = Math.round(+q.get('n'));
    $(last.mode === 'end' ? 'modeEnd' : 'modeDur').checked = true;
    $('total').value = last.total / 60000; $('endAt').value = last.endHM; $('count').value = last.n;
    s = fresh();
  }
  // Fill the inputs from the state once; after that the inputs are the source of truth.
  $(s.mode === 'end' ? 'modeEnd' : 'modeDur').checked = true; $('total').value = s.total / 60000; $('endAt').value = s.endHM; $('count').value = s.n;
  render();
  setInterval(render, 250);
}
start();
</script>
</body>
</html>
